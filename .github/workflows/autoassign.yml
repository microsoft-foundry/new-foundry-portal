name: Auto Assign Issues

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  
jobs:
  assign-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign based on keywords
        uses: actions/github-script@v7
        with:
          script: |
            const assignments = [
              { keywords: ["pipeline", "workflow", "multi-modal", "multimodal"], assignee: "fniedtner" },
              { keywords: ["playground", "model details"], assignee: "tgokal" },
              { keywords: ["tool", "MCP", "OAuth"], assignee: "lindazqli" },
              { keywords: ["agent"], "excludeKeywords": ["tool", "EntraID", "MCP", "OAuth", "workflow", "multi-modal", "multimodal", "rag", "RAG", "data", "IQ", "file", "vector", "knowledge"], assignee: "lebaro-msft" },
              { keywords: ["fine-tuning", "finetuning"], assignee: "AliciaFrame" },
              { keywords: ["deployment", "quota"], assignee: "johnrsanders" },
              { keywords: ["rag", "RAG", "data", "IQ", "file", "vector", "knowledge"], assignee: "farzad528" },
              { keywords: ["model", "catalog", "template"], assignee: "amibp" },
              { keywords: ["design", "UI", "interface"], assignee: "Quirinevwm" },
              { keywords: ["prepare agent", "publish", "published", "publishing", "M365", "Microsoft 365 Copilot", "Agent 365", "A365", "Teams", "Agent Application", "EntraID"], assignee: "fosteramanda" },
              { keywords: ["tracing"], assignee: "skohlmeier123" },
              { keywords: ["slow", "error", "API"], assignee: "slumley" },
              // Example with multiple keywords for the same assignee:
              // { keywords: ["pipeline", "workflow", "multi-modal", "multimodal"], assignee: "fniedtner" },
            ];
            let assignees = [];
            const issueTitle = context.payload.issue.title.toLowerCase();
            for (const { keywords, assignee } of assignments) {
              if (
                keywords.some(keyword =>
                  issueTitle.includes(keyword)
                )
              ) {
                assignees.push(assignee);
              }
            }
            if (assignees.length === 0) {
              // No keywords matched, assign to yourself
              assignees.push("esrabakkal");
            }
            // Remove duplicates just in case
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              assignees: [...new Set(assignees)]
            });
