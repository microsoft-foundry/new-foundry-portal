name: Create Azure DevOps Bug from Issue

on:
  issues:
    types: [opened]

jobs:
  create-azure-bug:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout your repo to access files
      - uses: actions/checkout@v4

      # 2. Copy the mapping file for use (or just use in-place if you prefer)
      - name: Get user mapping file
        run: cp .github/github-to-ado-users.json github-to-ado-users.json

      # 3. Create a bug in Azure DevOps, mapping assignee if possible
      - name: Create Azure DevOps Bug
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
          AZURE_DEVOPS_ORG: ${{ secrets.AZURE_DEVOPS_ORG }}
          AZURE_DEVOPS_PROJECT: ${{ secrets.AZURE_DEVOPS_PROJECT }}
        run: |
          TITLE="${{ github.event.issue.title }}"
          DESCRIPTION="${{ github.event.issue.body }}"
          ASSIGNEE_GITHUB="${{ github.event.issue.assignee.login }}"
          LABELS=$(echo '${{ toJSON(github.event.issue.labels) }}' | jq -r '.[].name' | paste -sd "," -)

          # Load mapping from GitHub username to Azure DevOps user email
          if [ -n "$ASSIGNEE_GITHUB" ]; then
            ASSIGNEE_ADO=$(jq -r --arg user "$ASSIGNEE_GITHUB" '.[$user]' github-to-ado-users.json)
          else
            ASSIGNEE_ADO=""
          fi

          # Build the start of the JSON payload
          JSON_PAYLOAD="[
            { \"op\": \"add\", \"path\": \"/fields/System.Title\", \"value\": $(jq -Rn --arg v \"$TITLE\" '$v') },
            { \"op\": \"add\", \"path\": \"/fields/System.Description\", \"value\": $(jq -Rn --arg v \"$DESCRIPTION\" '$v') }"

          # Add assignee if applicable
          if [ -n "$ASSIGNEE_ADO" ] && [ "$ASSIGNEE_ADO" != "null" ]; then
            JSON_PAYLOAD="$JSON_PAYLOAD, { \"op\": \"add\", \"path\": \"/fields/System.AssignedTo\", \"value\": $(jq -Rn --arg v \"$ASSIGNEE_ADO\" '$v') }"
          fi

          # Add tags if applicable
          if [ -n "$LABELS" ]; then
            JSON_PAYLOAD="$JSON_PAYLOAD, { \"op\": \"add\", \"path\": \"/fields/System.Tags\", \"value\": $(jq -Rn --arg v \"$LABELS\" '$v') }"
          fi

          # Close JSON array
          JSON_PAYLOAD="$JSON_PAYLOAD
          ]"

          API_URL="https://dev.azure.com/$AZURE_DEVOPS_ORG/$AZURE_DEVOPS_PROJECT/_apis/wit/workitems/\$Bug?api-version=7.0"
          echo "Payload: $JSON_PAYLOAD"

          curl -s -u ":$AZURE_DEVOPS_PAT" \
            -H "Content-Type: application/json-patch+json" \
            -X POST "$API_URL" \
            -d "$JSON_PAYLOAD"
